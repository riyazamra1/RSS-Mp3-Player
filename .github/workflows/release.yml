name: Build and publish signed RSS Mp3 Player release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v1.1"
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Verify signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.RSS_ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RSS_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RSS_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RSS_ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Configure RSS_ANDROID_KEYSTORE_BASE64, RSS_ANDROID_KEYSTORE_PASSWORD, RSS_ANDROID_KEY_ALIAS and RSS_ANDROID_KEY_PASSWORD in repository Actions secrets. Never commit the signing key."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/rss-release.keystore"
          echo "RSS_ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/rss-release.keystore" >> "$GITHUB_ENV"

      - name: Resolve release version
        id: release
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          TAG="$INPUT_TAG"
          if [ -z "$TAG" ]; then TAG="$REF_NAME"; fi
          if [ -z "$TAG" ]; then echo "::error::Release tag is required"; exit 1; fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$((RUN_NUMBER + 2))" >> "$GITHUB_OUTPUT"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Build signed release APK
        env:
          RSS_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.RSS_ANDROID_KEYSTORE_PASSWORD }}
          RSS_ANDROID_KEY_ALIAS: ${{ secrets.RSS_ANDROID_KEY_ALIAS }}
          RSS_ANDROID_KEY_PASSWORD: ${{ secrets.RSS_ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon -PversionName='${{ steps.release.outputs.version }}' -PversionCode='${{ steps.release.outputs.code }}' assembleRelease

      - name: Verify release APK
        run: test -s app/build/outputs/apk/release/app-release.apk

      - name: Publish GitHub Release and APK asset
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" app/build/outputs/apk/release/app-release.apk \
            --repo "$GITHUB_REPOSITORY" --title "RSS Mp3 Player $RELEASE_TAG" \
            --notes "RSS Mp3 Player Android release. The app can download this APK; Android still asks the user to approve installation."
